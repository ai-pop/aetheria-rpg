name: Идея / Feature request
description: Предложить улучшение Aetheria
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает предложение? / What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы / Alternatives
